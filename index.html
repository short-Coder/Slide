<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スライドで学ぶ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#eef1f4; --panel:#fff; --ink:#16212e; --muted:#5b6878; --line:#d3dae2;
  --accent:#1f4fbf; --accent-soft:#dfe8fb; --ok:#17794a; --ng:#b3321f;
  --code-bg:#13202f; --code-fg:#dbe5f1; --c-kw:#7fb2ff; --c-ty:#7ee0c3; --c-st:#f2c46d; --c-cm:#7b8aa0; --c-nm:#f29b7c; --c-dr:#c4a2f5;
  --sans:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0f1721; --panel:#18232f; --ink:#e6edf5; --muted:#94a3b5; --line:#2a3949; --accent:#6f9bff; --accent-soft:#1d2d4d; --ok:#4cc38a; --ng:#ff8a75; --code-bg:#0b121a}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.75;display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr auto;grid-template-areas:"rail stage" "rail bar"}
a,button,label{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 章レール：スライドの位置関係を示す */
#rail{grid-area:rail;border-right:1px solid var(--line);padding:24px 0 16px;overflow:auto;display:flex;flex-direction:column;background:var(--panel)}
#rail h1{font-size:1.15rem;margin:0 20px 2px;line-height:1.4}
#rail p{margin:0 20px 18px;color:var(--muted);font-size:.85rem;line-height:1.5}
#toc{list-style:none;margin:0;padding:0;flex:1}
#toc .ch{margin:14px 20px 4px;font-size:.8rem;font-weight:700;color:var(--muted)}
#toc button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:5px 20px 5px 17px;border-left:3px solid transparent;cursor:pointer;font-size:.92rem;line-height:1.5}
#toc button:hover{background:var(--paper)}
#toc button[aria-current=true]{border-left-color:var(--accent);background:var(--accent-soft);font-weight:700}
#toc button.done::after{content:" ✓";color:var(--ok)}
#loader{margin:12px 20px 0;font-size:.82rem;color:var(--muted)}
#loader label{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink);background:var(--paper)}
#loader input{position:absolute;opacity:0;width:1px;height:1px}
#loader input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

/* ステージ */
#stage{grid-area:stage;overflow:auto;padding:clamp(20px,4vw,56px)}
.slide{max-width:880px;margin:0 auto}
.slide .chapter{color:var(--accent);font-weight:700;font-size:.95rem;margin:0 0 4px}
.slide h2{font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.3;margin:0 0 16px;letter-spacing:.01em}
.slide .lead{font-size:1.1rem;max-width:44em;margin:0 0 22px}
.code{margin:0 0 20px;border-radius:10px;overflow:hidden;background:var(--code-bg);color:var(--code-fg)}
.code .cap{font:600 .78rem var(--mono);padding:8px 16px;border-bottom:1px solid #ffffff1f;color:#9fb0c6}
.code pre{margin:0;padding:16px;overflow-x:auto;font:400 .95rem/1.65 var(--mono);tab-size:4}
.code .out{border-top:1px dashed #ffffff33;padding:10px 16px 12px;font:400 .9rem/1.6 var(--mono);color:#b8f0d2;white-space:pre-wrap}
.code .out b{display:block;color:#9fb0c6;font-weight:600;font-size:.75rem;margin-bottom:2px}
.k{color:var(--c-kw)}.t{color:var(--c-ty)}.s{color:var(--c-st)}.c{color:var(--c-cm);font-style:italic}.n{color:var(--c-nm)}.d{color:var(--c-dr)}
.points{margin:0 0 20px;padding-left:1.3em;max-width:44em}
.points li{margin:6px 0}
.points li::marker{color:var(--accent)}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 14px;border-radius:0 8px 8px 0;max-width:44em}
.quiz{margin-top:24px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:16px 18px;max-width:44em}
.quiz .q{font-weight:700;margin:0 0 10px}
.quiz .opts{display:grid;gap:8px}
.quiz button{text-align:left;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer}
.quiz button:hover:not(:disabled){border-color:var(--accent)}
.quiz button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.quiz button.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 16%,transparent)}
.quiz .exp{margin:10px 0 0;font-size:.95rem}
.err{max-width:34em;margin:10vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.err code{font-family:var(--mono);background:var(--paper);padding:1px 6px;border-radius:4px}

#sum{font-weight:700;color:var(--ok)}
#toc .lesson{display:flex;justify-content:space-between;gap:8px;font-weight:700;padding-top:9px;padding-bottom:9px;border-top:1px solid var(--line)}
#toc .lesson.open{background:var(--paper)}
#toc .sub{list-style:none;margin:0 0 6px;padding:0;background:var(--paper)}
#toc .sub button{padding-left:34px;font-size:.88rem;color:var(--muted)}
#toc .sub button[aria-current=true]{color:var(--ink)}
.m{font-style:normal;font-size:.72rem;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:0 8px;line-height:1.7;align-self:center;white-space:nowrap}
#reset{margin-top:10px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:.8rem}
.goal{margin:0 0 14px;padding:8px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line);max-width:44em;font-size:.95rem}
.goal b{margin-right:.8em;color:var(--accent)}
.code{margin:0 0 20px}
.finish{margin-top:28px;padding:16px 18px;border:2px dashed var(--accent);border-radius:10px;max-width:44em;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.finish p{margin:0;flex:1 1 16em}
.primary{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;padding:9px 22px;font-weight:700;cursor:pointer}
@media (prefers-color-scheme:dark){.primary{color:#0b121a}}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.acts button:not(.primary){border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:9px 22px;font-weight:700;cursor:pointer}
.mastery{text-align:center;padding-top:6vh}
.mastery .lead{margin-left:auto;margin-right:auto}
.acts{justify-content:center}
.stamp{display:inline-block;font-size:clamp(2.6rem,8vw,4.6rem);font-weight:700;letter-spacing:.12em;color:var(--ok);border:6px solid var(--ok);border-radius:14px;padding:.1em .5em;margin-bottom:24px;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}

#toc .part button{margin-top:8px;font-size:.8rem;font-weight:700;color:var(--muted)}
#toc .part button.open{color:var(--accent)}
.m.soon{color:var(--muted);border-color:var(--line)}
/* 操作バー */
#bar{grid-area:bar;display:flex;align-items:center;gap:14px;padding:10px clamp(16px,4vw,56px);border-top:1px solid var(--line);background:var(--panel)}
#bar button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 18px;cursor:pointer;font-weight:700}
#bar button:disabled{opacity:.4;cursor:default}
#bar #next{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){#bar #next{color:#0b121a}}
#prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
#count{font:600 .85rem var(--mono);color:var(--muted);min-width:5em;text-align:right}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"rail" "stage" "bar"}
  #rail{max-height:30vh;border-right:0;border-bottom:1px solid var(--line);padding-top:14px}
  #rail p{display:none}
}
@media (prefers-reduced-motion:reduce){#prog i{transition:none}}
#pdfbox{margin-top:14px;font-size:.82rem;color:var(--muted)}
#pdfbox select,#pdfbox button{font:inherit;margin-top:4px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
#pdfbox button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){#pdfbox button{color:#0b121a}}
#print{display:none}
@media print{
  @page{size:A4;margin:8mm}
  html,body{height:auto;background:#fff;color:#000}
  body{display:block}
  #rail,#stage,#bar{display:none!important}
  #print{display:block}
  .sheet{width:194mm;height:281mm;display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);gap:3mm;break-after:page}
  .sheet:last-child{break-after:auto}
  .pg{border:.3mm solid #999;padding:3mm;overflow:hidden;font:7.4pt/1.45 var(--sans);color:#000;background:#fff}
  .n2 .pg{font-size:10pt}.n1 .pg{font-size:12pt}
  .pg .ph{color:#555;font-size:.85em}
  .pg h3{margin:.2em 0 .4em;font-size:1.5em;line-height:1.3}
  .pg p{margin:0 0 .5em}
  .pg pre{margin:0 0 .5em;padding:1.5mm;border:.2mm solid #aaa;background:#f3f3f3;font:.95em/1.35 var(--mono);white-space:pre-wrap;word-break:break-all}
  .pg .out{border-left:.6mm solid #080;padding-left:1.5mm;margin:0 0 .5em;white-space:pre-wrap;font:.95em/1.35 var(--mono)}
  .pg ul{margin:0 0 .5em;padding-left:1.3em}
  .pg .qa{font-size:.95em;border-top:.2mm dashed #999;padding-top:.5em}
}
</style>
</head>
<body>
<nav id="rail" aria-label="目次">
  <h1 id="title">読み込み中…</h1>
  <p id="sub"></p>
  <p id="sum" style="margin:-10px 20px 12px;font-size:.85rem"></p>
  <ul id="toc"></ul>
  <div id="loader"><label><input type="file" accept=".json,application/json"><span>別のデータを開く</span></label><div id="pdfbox"><b>PDFで書き出す</b><br><select id="pdfScope" aria-label="範囲"><option value="all">全レッスン</option><option value="part">この部</option><option value="one">このレッスン</option></select> <select id="pdfN" aria-label="1枚あたりのページ数"><option value="4">4ページ/枚</option><option value="2">2ページ/枚</option><option value="1">1ページ/枚</option></select> <button type="button" id="pdf">書き出し</button><br>印刷画面で、送信先を「PDFに保存」にしてください。</div>
  <br><button type="button" id="reset">進捗をリセット</button></div>
</nav>
<main id="stage" tabindex="-1" aria-live="polite"></main>
<div id="bar">
  <button id="prev" type="button">前へ</button>
  <div id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  <span id="count"></span>
  <button id="next" type="button">次へ</button>
</div>

<div id="print"></div>
<script>
const DATA_URL = 'data.json';
let D = null, L = 0, idx = 0, view = 'slide', mastered = new Set(), seen = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const key = () => 'progress:' + D.meta.language + ':' + D.meta.title;
const loadP = () => { try { mastered = new Set(JSON.parse(localStorage.getItem(key()) || '[]')); } catch (e) { mastered = new Set(); } };
const saveP = () => { try { localStorage.setItem(key(), JSON.stringify([...mastered])); } catch (e) {} };

/* data.json の meta だけで動く簡易シンタックスハイライト */
function highlight(src, m) {
  const kw = new Set(m.keywords || []), ty = new Set(m.types || []);
  const cm = (m.comments || []).length ? m.comments.map(reEsc).join('|') : '(?!)';
  const dr = m.directive ? '^[ \\t]*' + reEsc(m.directive) + '[^\\n]*' : '(?!)';
  const re = new RegExp(
    `(${dr})|((?:${cm})[^\\n]*)|("(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*')|(\\b\\d[\\w.]*)|(\\b[A-Za-z_]\\w*\\b)`, 'gm');
  let out = '', last = 0, r;
  while ((r = re.exec(src))) {
    out += esc(src.slice(last, r.index));
    const [t, d, c, s, n, w] = r;
    const cls = d ? 'd' : c ? 'c' : s ? 's' : n ? 'n' : kw.has(w) ? 'k' : ty.has(w) ? 't' : '';
    out += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
    last = re.lastIndex;
    if (t === '') re.lastIndex++;
  }
  return out + esc(src.slice(last));
}

const lesson = () => D.lessons[L];
const ready = l => Array.isArray(l.slides) && l.slides.length > 0;
const lastIdx = () => (ready(lesson()) ? lesson().slides.length : 1) - 1;

function init(data) {
  D = data; loadP(); seen = new Set();
  document.title = D.meta.title + ' | スライドで学ぶ';
  $('#title').textContent = D.meta.title;
  $('#sub').textContent = D.meta.subtitle || '';
  const m = /^#l(\d+)-(\d+)$/.exec(location.hash);
  const li = m ? +m[1] - 1 : firstOpen();
  openLesson(li >= 0 && li < D.lessons.length ? li : 0, m ? +m[2] - 1 : 0);
}
function firstOpen() { const i = D.lessons.findIndex((l, k) => ready(l) && !mastered.has(k)); return i < 0 ? 0 : i; }
function openLesson(li, si = 0) { L = li; go(si); }

function rail() {
  $('#sum').textContent = `マスター ${mastered.size} / ${D.lessons.length} レッスン（公開済み ${D.lessons.filter(ready).length}）`;
  const cp = lesson().part || '';
  let h = '', prev = null;
  D.lessons.forEach((l, li) => {
    const p = l.part || '';
    if (p !== prev) { prev = p; if (p) h += `<li class="part"><button type="button" data-l="${li}" class="${p === cp ? 'open' : ''}">${esc(p)}</button></li>`; }
    if (p !== cp) return;
    h += `<li><button type="button" class="lesson${li === L ? ' open' : ''}" data-l="${li}"><span>レッスン${li + 1}　${esc(l.title)}</span>${mastered.has(li) ? '<em class="m">マスター</em>' : !ready(l) ? '<em class="m soon">準備中</em>' : ''}</button>` +
    (li === L && ready(l) ? `<ul class="sub">${l.slides.map((s, i) => {
      const cur = view === 'slide' && i === idx;
      return `<li><button type="button" data-s="${i}"${cur ? ' aria-current="true"' : ''} class="${!cur && seen.has(L + ':' + i) ? 'done' : ''}">${esc(s.title)}</button></li>`;
    }).join('')}</ul>` : '') + `</li>`;
  });
  $('#toc').innerHTML = h;
  const cur = $('#toc [aria-current]') || $('#toc .open'); if (cur) cur.scrollIntoView({block: 'nearest'});
}

function render(s, i) {
  const les = lesson();
  let h = `<article class="slide"><p class="chapter">レッスン${L + 1}　${esc(les.title)}</p><h2>${esc(s.title)}</h2>`;
  if (i === 0 && les.goal) h += `<p class="goal"><b>目標</b>${esc(les.goal)}</p>`;
  if (s.lead) h += `<p class="lead">${esc(s.lead)}</p>`;
  if (s.code) {
    h += `<figure class="code">${s.code.caption ? `<div class="cap">${esc(s.code.caption)}</div>` : ''}<pre><code>${highlight(s.code.text, D.meta)}</code></pre>`;
    if (s.output) h += `<div class="out"><b>実行結果</b>${esc(s.output)}</div>`;
    h += `</figure>`;
  }
  if (s.points && s.points.length) h += `<ul class="points">${s.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`;
  if (s.note) h += `<p class="note">${esc(s.note)}</p>`;
  if (s.quiz) h += `<section class="quiz"><p class="q">確認：${esc(s.quiz.q)}</p><div class="opts">` +
    s.quiz.choices.map((c, k) => `<button type="button" data-a="${k}">${esc(c)}</button>`).join('') +
    `</div><p class="exp" hidden></p></section>`;
  if (i === lastIdx()) h += mastered.has(L)
    ? `<div class="finish"><em class="m">マスター済み</em><span>このレッスンは完了しています。</span></div>`
    : `<div class="finish"><p>このレッスンの内容は以上です。理解できたら完了ボタンを押してください。</p><button type="button" class="primary" data-act="done">レッスン完了</button></div>`;
  return h + `</article>`;
}

function soon() {
  view = 'soon'; idx = 0;
  $('#stage').innerHTML = `<article class="slide"><p class="chapter">レッスン${L + 1}　${esc(lesson().part || '')}</p><h2>${esc(lesson().title)}</h2><p class="goal"><b>目標</b>${esc(lesson().goal || '')}</p><p class="lead">このレッスンは準備中です。公開済みのレッスンに進みましょう。</p></article>`;
  rail(); bar(); history.replaceState(null, '', `#l${L + 1}-1`);
}

function go(i) {
  if (!ready(lesson())) return soon();
  view = 'slide'; idx = Math.max(0, Math.min(lastIdx(), i));
  seen.add(L + ':' + idx);
  const s = lesson().slides[idx], st = $('#stage');
  st.innerHTML = render(s, idx); st.scrollTop = 0;
  const q = st.querySelector('.quiz');
  if (q) q.addEventListener('click', e => {
    const b = e.target.closest('button[data-a]'); if (!b || b.disabled) return;
    const ok = +b.dataset.a === s.quiz.answer;
    q.querySelectorAll('button').forEach(x => { x.disabled = true; if (+x.dataset.a === s.quiz.answer) x.classList.add('ok'); });
    if (!ok) b.classList.add('ng');
    const ex = q.querySelector('.exp'); ex.hidden = false;
    ex.textContent = (ok ? '正解です。' : '不正解です。') + (s.quiz.explain || '');
  });
  rail(); bar();
  history.replaceState(null, '', `#l${L + 1}-${idx + 1}`);
}

function complete() {
  mastered.add(L); saveP(); view = 'mastery';
  const all = mastered.size === D.lessons.length, more = L + 1 < D.lessons.length, st = $('#stage');
  st.innerHTML = `<article class="slide mastery"><div class="stamp">マスター</div>
    <h2>レッスン${L + 1}「${esc(lesson().title)}」を完了しました</h2>
    <p class="lead">${all ? 'すべてのレッスンをマスターしました。お疲れさまでした。' : `達成：${mastered.size} / ${D.lessons.length} レッスン`}</p>
    <div class="acts">${more ? '<button type="button" class="primary" data-act="next">次のレッスンへ</button>' : ''}<button type="button" data-act="review">もう一度見る</button></div></article>`;
  st.scrollTop = 0; rail(); bar();
}

function bar() {
  if (view === 'soon') { $('#prog i').style.width = '0%'; $('#count').textContent = '準備中'; $('#prev').disabled = L === 0; $('#next').textContent = '次のレッスンへ'; $('#next').disabled = L + 1 >= D.lessons.length; return; }
  const n = lesson().slides.length, mv = view === 'mastery', last = idx === n - 1, more = L + 1 < D.lessons.length;
  const pct = mv ? 100 : Math.round((idx + 1) / n * 100);
  $('#prog i').style.width = pct + '%'; $('#prog').setAttribute('aria-valuenow', pct);
  $('#count').textContent = `${mv ? n : idx + 1} / ${n}`;
  $('#prev').disabled = !mv && idx === 0;
  const finished = mv || (last && mastered.has(L));
  $('#next').textContent = finished ? (more ? '次のレッスンへ' : '最終レッスンです') : last ? 'レッスン完了' : '次へ';
  $('#next').disabled = finished && !more;
}

function stepNext() {
  if (view === 'soon') { if (L + 1 < D.lessons.length) openLesson(L + 1); return; }
  const slide = view === 'slide';
  if (slide && idx < lastIdx()) go(idx + 1);
  else if (slide && !mastered.has(L)) complete();
  else if (L + 1 < D.lessons.length) openLesson(L + 1);
}
function stepPrev() {
  if (view === 'soon') { if (L > 0) openLesson(L - 1); return; }
  view === 'mastery' ? go(idx) : go(idx - 1);
}

function fail(msg) {
  $('#title').textContent = 'データを読み込めません';
  $('#stage').innerHTML = `<div class="err"><p><b>${esc(msg)}</b></p>
    <p>ブラウザでファイルを直接開くと、<code>data.json</code> を自動で読めないことがあります。次のどちらかを試してください。</p>
    <ul><li>このフォルダで <code>python3 -m http.server</code> を実行し、<code>http://localhost:8000/</code> を開く</li>
    <li>左のレールの「別のデータを開く」から <code>data.json</code> を選ぶ</li></ul></div>`;
}
function accept(d) {
  if (!d || !d.meta || !Array.isArray(d.lessons) || !d.lessons.length || d.lessons.some(l => !l.title))
    throw new Error('JSONの形式が正しくありません。meta と、slides を持つ lessons が必要です。');
  init(d);
}

$('#prev').onclick = stepPrev;
$('#next').onclick = stepNext;
$('#stage').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  if (b.dataset.act === 'done') complete();
  else if (b.dataset.act === 'next') openLesson(L + 1);
  else if (b.dataset.act === 'review') go(0);
});
$('#toc').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.l !== undefined) openLesson(+b.dataset.l);
  else if (b.dataset.s !== undefined) go(+b.dataset.s);
});
$('#reset').onclick = () => { if (D && confirm('マスターの記録をすべて消します。よろしいですか？')) { mastered.clear(); saveP(); seen = new Set(); openLesson(0); } };
document.addEventListener('keydown', e => {
  if (!D || e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { if (!$('#next').disabled) stepNext(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { if (!$('#prev').disabled) stepPrev(); }
});
$('#loader input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => accept(JSON.parse(t))).catch(err => fail(err.message));
  e.target.value = '';
});
function buildPrint() {
  const scope = $('#pdfScope').value, n = +$('#pdfN').value, cp = lesson().part;
  const items = [];
  D.lessons.forEach((l, li) => {
    if (!ready(l) || (scope === 'part' && l.part !== cp) || (scope === 'one' && li !== L)) return;
    l.slides.forEach(sl => items.push([l, li, sl]));
  });
  if (!items.length) { alert('書き出せるレッスンがありません。'); return false; }
  const cell = ([l, li, sl]) => `<div class="pg"><div class="ph">レッスン${li + 1}　${esc(l.part || '')}</div><h3>${esc(sl.title)}</h3>` +
    (sl.lead ? `<p>${esc(sl.lead)}</p>` : '') +
    (sl.code ? `<pre>${esc(sl.code.text)}</pre>` : '') +
    (sl.output ? `<div class="out">${esc(sl.output)}</div>` : '') +
    (sl.points ? `<ul>${sl.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '') +
    (sl.note ? `<p>${esc(sl.note)}</p>` : '') +
    (sl.quiz ? `<div class="qa">Q. ${esc(sl.quiz.q)}<br>A. ${esc(sl.quiz.choices[sl.quiz.answer])}　${esc(sl.quiz.explain || '')}</div>` : '') + `</div>`;
  const c = n === 4 ? 2 : 1, r = n === 1 ? 1 : 2;
  let h = '';
  for (let i = 0; i < items.length; i += n) h += `<section class="sheet" style="--c:${c};--r:${r}">${items.slice(i, i + n).map(cell).join('')}</section>`;
  const pr = $('#print'); pr.className = 'n' + n; pr.innerHTML = h;
  return true;
}
$('#pdf').onclick = () => { if (D && buildPrint()) window.print(); };
fetch(DATA_URL).then(r => { if (!r.ok) throw new Error(DATA_URL + ' が見つかりません（' + r.status + '）'); return r.json(); })
  .then(accept).catch(err => fail(err.message || 'データの取得に失敗しました。'));
</script>
</body>
